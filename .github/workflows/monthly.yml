name: Monthly Accounting Jobs

on:
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

jobs:
  monthly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run monthly:jobs
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_USER_ID: ${{ secrets.CRON_USER_ID }}
